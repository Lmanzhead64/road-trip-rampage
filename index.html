function phaseIndex(){return Math.min(PHASES.length-1,Math.floor((Math.max(1,level)-1)/10));}
function phase(){return PHASES[phaseIndex()];}
function mapTier(){return phaseIndex()+1;}
function levelInMap(){return ((Math.max(1,level)-1)%10)+1;}
function isMajorBossLevel(){return level%10===0;}
function bossNameForLevel(){return isMajorBossLevel()?phase().boss:"Field Commander";}
function bossFeatureText(){return isMajorBossLevel()?phase().power:"mobile cannon pressure";}
function fmtClock(frames){var s=Math.floor(frames/60),m=Math.floor(s/60);s%=60;return (m<10?"0":"")+m+":"+(s<10?"0":"")+s;}
function vehicleRank(id){return vehicleRanks[id]||1;}
function vehicleDef(){return VEHICLES[currentVehicle]||VEHICLES.dozer1;}
function baseSkinDef(id){return TANK_SKINS[id||currentSkin]||TANK_SKINS.factory;}
function paintDef(id){return PAINTS[id||currentPaint]||PAINTS.gunmetal;}
function skinDef(id){
  var sk=Object.assign({},baseSkinDef(id));
  if(!id||id===currentSkin){
    var p=paintDef();
    if(p.body){sk.body=p.body;sk.cab=p.cab;sk.blade=p.blade;sk.stripe=p.stripe;sk.accent=p.accent;sk.glow=p.glow;sk.diamond=!!p.diamond;}
  }
  return sk;
}
function upgradeLevel(id){return upgradeLevels[id]||0;}
function vehicleRankBonus(mult){return Math.max(0,vehicleRank(currentVehicle)-1)*mult;}
function effectiveMaxHp(){var v=vehicleDef();return Math.round(P.maxHp+v.hp+vehicleRankBonus(22));}
function effectiveArmor(){var v=vehicleDef();return Math.round(P.armor+(P.boostArmor||0)+v.armor+vehicleRankBonus(4));}
function effectiveDmg(){var v=vehicleDef();return Math.round(P.dmg+(P.boostDmg||0)+v.dmg+vehicleRankBonus(3));}
function effectiveSpeed(){var v=vehicleDef();return Math.max(2.8,Math.min(8.6,P.speed+v.speed+vehicleRankBonus(0.04)));}
function effectiveMissileCap(){var v=vehicleDef();return Math.max(0,P.missileCap+v.missile);}
function effectiveRepair(){return P.regen+(P.boostRepair||0)+(vehicleDef().repair||0)+(village.medic||0)*2;}
function villageMaxHp(){return 130+(village.wall||0)*42+(village.workshop||0)*12;}
function villageTurretRate(){return Math.max(18,64-(village.turret||0)*6);}
function villageTurretDamage(){return 10+(village.turret||0)*8+(village.workshop||0)*2;}
function villageLaserRate(){return Math.max(26,94-(village.laser||0)*8-(vehicleDef().laser||0)*4);}
function villageLaserDamage(){return 18+(village.laser||0)*18+(village.workshop||0)*3+(vehicleDef().laser||0)*10;}
function baseShieldReduction(){return (village.shield||0)*5;}
function resetRunStats(){runStats={maxCombo:0,missilesFired:0,missileKills:0,baseDamage:0,tankKills:0,bossKills:0};lastOpReport="";}
function contractStreakTarget(){return Math.min(28,5+phaseIndex()*3+Math.floor(level/9));}
function contractArmorTarget(){return Math.min(8,1+phaseIndex()+Math.floor(level/18));}
function operationContracts(){
  return[
    {name:"Hold The Line",desc:"Village 70%+",reward:2+phaseIndex(),done:function(){return base.max>0&&base.hp/base.max>=0.7;},progress:function(){return Math.max(0,Math.round(base.hp/base.max*100))+"%";}},
    {name:"Kill Chain",desc:"Streak "+contractStreakTarget(),reward:2+phaseIndex(),done:function(){return runStats.maxCombo>=contractStreakTarget();},progress:function(){return runStats.maxCombo+"/"+contractStreakTarget();}},
    {name:"Armor Breaker",desc:"Heavy kills "+contractArmorTarget(),reward:3+phaseIndex(),done:function(){return runStats.tankKills+runStats.bossKills>=contractArmorTarget();},progress:function(){return (runStats.tankKills+runStats.bossKills)+"/"+contractArmorTarget();}}
  ];
}
function awardContracts(){
  var list=operationContracts(),bonus=0,done=0;
  for(var i=0;i<list.length;i++){if(list[i].done()){done++;bonus+=list[i].reward;}}
  if(bonus>0){credits+=bonus;totalScore+=bonus*120;}
  lastOpReport="CONTRACTS "+done+"/"+list.length+(bonus>0?"  +"+bonus+" CREDITS":"");
  return{done:done,total:list.length,bonus:bonus};
}

  if(!it.weapon){if(itemOwned(it)||itemMaxed(it))return 0;return it.costFunc?it.costFunc():it.maxLv?coreUpgradeCost(it):it.cost;}
  var id=it.weapon,w=WEAPONS[id];

  if(P.weapon===id&&weaponLevel(id)<(w.maxLv||5))return weaponUpgradeCost(id);

    }

  }

      credits-=cost;ownedPaints[pid]=true;currentPaint=pid;
      shopNotice(pt.name+" paint unlocked and applied","#facc15");notify("CUSTOM PAINT: "+pt.name,"#facc15");saveGame();return;
    }
    currentPaint=pid;shopNotice(pt.name+" paint applied","#5eead4");notify("PAINT: "+pt.name,"#5eead4");saveGame();return;
  }
  if(itemOwned(it)){shopNotice(itemName(it)+" already installed","#facc15");return;}
  if(itemMaxed(it)){shopNotice(itemName(it)+" is fully upgraded","#facc15");return;}
  if(it.vehicle){
    var vid=it.vehicle,v=VEHICLES[vid];

    P.hp=effectiveMaxHp();shopNotice(v.name+" ranked to "+vehicleRank(vid),"#facc15");notify(v.name+" RANK "+vehicleRank(vid),"#facc15");saveGame();return;
  }
  if(it.weapon){

    if(!ownedWeapons[id]){
      if(credits<cost){shopNotice("Need "+(cost-credits)+" more credits to unlock "+w.name,"#ff7675");return;}
      credits-=cost;ownedWeapons[id]=true;weaponLevels[id]=1;P.weapon=id;
      shopNotice(w.name+" unlocked and equipped","#facc15");notify("UNLOCKED: "+w.name,"#facc15");saveGame();return;
    }
    if(P.weapon!==id){P.weapon=id;shopNotice(w.name+" equipped","#5eead4");notify("WEAPON: "+w.name,"#5eead4");saveGame();return;}
    if(weaponLevel(id)>=(w.maxLv||5)){shopNotice(w.name+" is fully upgraded","#facc15");return;}
    if(credits<cost){shopNotice("Need "+(cost-credits)+" more credits to upgrade "+w.name,"#ff7675");return;}

    shopNotice(w.name+" upgraded to Lv."+weaponLevel(id),"#facc15");notify(w.name+" LV."+weaponLevel(id),"#facc15");saveGame();return;
  }
  if(credits<cost){shopNotice("Need "+(cost-credits)+" more credits for "+it.name,"#ff7675");return;}
  credits-=cost;
  var msg=it.apply();
  if(it.maxLv)upgradeLevels[it.id]=Math.min(it.maxLv,upgradeLevel(it.id)+1);

function findTarget(){
  var best=null,bestD=Infinity;
  for(var i=0;i<enemies.length;i++){var d=dist(P,enemies[i]);
    // Only target enemies within bullet range (on screen, not too far)
    if(d<400&&d<bestD){bestD=d;best=enemies[i];}}
  return best;}
function findNearestEnemy(from,maxD){
  var best=null,bestD=maxD||Infinity;
  for(var i=0;i<enemies.length;i++){var d=dist(from,enemies[i]);if(d<bestD){bestD=d;best=enemies[i];}}
  return best;}

function fire(){
  if(P.fireCD>0)return;
  var w=WEAPONS[P.weapon],wl=weaponLevel(P.weapon),power=weaponPower(P.weapon);
  P.fireCD=Math.max(2,Math.round(w.rate*(10/P.fireRate)/(1+wl*0.04)));
  cam.shake=Math.max(cam.shake,1.5);
  var shots=w.count+(P.weapon==="shotgun"&&wl>=4?1:0);
  for(var i=0;i<shots;i++){
    var spread=rand(-1,1)*w.spread;
    var angle=P.angle+spread;
    var bx=P.x+Math.cos(P.angle)*24,by=P.y+Math.sin(P.angle)*24;
    bullets.push({x:bx,y:by,vx:Math.cos(angle)*w.speed,vy:Math.sin(angle)*w.speed,

function fireMissile(){

function detonateMissile(idx){

    if(d<ch.radius){var dmg=ch.dmg*(1-d/ch.radius*0.45);e.hp-=dmg;e.hitF=11;burst(e.x,e.y,10,"#fbbf24",4.4,16);
      floatT(e.x,e.y-e.size,Math.round(dmg).toString(),"#fff7ad",true);

function useBomb(){if(P.bombs<=0){notify("NO DEMO CHARGES","#ff7675");return;}P.bombs--;
  var target=findNearestEnemy(P,700),angle=target?Math.atan2(target.y-P.y,target.x-P.x):P.angle;

function killEnemy(idx){
  var e=enemies[idx];
  levelKills++;combo++;comboT=190;runStats.maxCombo=Math.max(runStats.maxCombo,combo);
  if(e.type==="tank")runStats.tankKills++;if(e.boss)runStats.bossKills++;if(killSource==="missile")runStats.missileKills++;
  sfx("kill");
  var mult=1+Math.min(2,Math.floor(combo/5)*0.25);
  var scoreGain=Math.round(e.score*mult);credits+=e.boss?3:1;totalScore+=scoreGain;
  if(combo>1)floatT(e.x,e.y-e.size-18,"x"+combo+"  +"+scoreGain,"#facc15",combo>4);
  if(combo>1&&combo%5===0){credits++;notify(combo+" KILL STREAK  +1 CREDIT","#facc15");sfx("combo");}
  P.hp=Math.min(effectiveMaxHp(),P.hp+effectiveRepair());
  explode(e.x,e.y,e.boss?2.4:1.05,e.color);
  burst(e.x,e.y,18,e.color,5,28);burst(e.x,e.y,8,"#fff",3,15);
  cam.shake=Math.max(cam.shake,e.boss?16:4);
  if(e.boss){flash=10;bossKilled=true;}
  // Drop (visible item on ground)
  if(Math.random()<0.5||e.boss){
    var types=[{t:"hp",l:"+HP",c:"#2ed573"},{t:"armor",l:"ARM",c:"#74b9ff"},
      {t:"bomb",l:"CHG",c:"#ffa502"},{t:"dmg",l:"+DMG",c:"#ff4757"},
      {t:"spd",l:"+SPD",c:"#7bed9f"},{t:"reg",l:"REPAIR",c:"#ff6b81"}];
    var d=types[Math.floor(rand(0,types.length))];
    drops.push({x:e.x,y:e.y,type:d.t,label:d.l,color:d.c,life:500,bob:rand(0,6.28)});}
  enemies.splice(idx,1);
  // Check level complete
  if(bossKilled&&enemies.length===0){levelComplete();}else saveGame();}

function collectDrop(d){

    case"spd":P.speed=Math.min(7.5,P.speed+0.2);floatT(d.x,d.y,"+SPD","#7bed9f",true);notify("TRACK SPEED UP","#7bed9f");break;
    case"reg":P.regen+=1;floatT(d.x,d.y,"+1 REPAIR","#ff6b81",true);notify("REPAIR CREW OUTPUT +1","#ff6b81");break;}
  burst(d.x,d.y,8,d.color,3,12);sfx("pickup");totalScore+=20;saveGame();}

function levelComplete(){combo=0;comboT=0;
  if(level>=MAX_LEVEL){totalScore+=25000;gameOver(true);return;}
  var oldPhase=phaseIndex(),contract=awardContracts(),supplyBonus=1+Math.floor((village.depot||0)*0.85);
  var cacheBonus=level%5===0?5+phaseIndex()*3:0,tierBonus=level%10===0?12+phaseIndex()*4:0;
  if(P.boostLevels>0){P.boostLevels--;if(P.boostLevels<=0){P.boostDmg=0;P.boostArmor=0;P.boostRepair=0;}}

  level++;saveGame();state=S.SHOP;sfx("level");
  shopNotice((phaseIndex()>oldPhase?"New phase reached: "+phase().name+". ":"Level cleared. ")+"Supply +"+supplyBonus+" credits. "+lastOpReport,"#cbd5e1");}

function saveNewHighScore(){if(ne.saved)return;var nm=nameInput?(nameInput.value.trim().replace(/\s+/g," ").slice(0,18)):"";
  if(!nm)nm="PLAYER";
  hs.push({n:nm,s:totalScore,l:level,phase:phase().name,vehicle:vehicleDef().name,d:new Date().toLocaleDateString()});
  hs.sort(function(a,b){return b.s-a.s;});hs=hs.slice(0,10);saveHS();ne.saved=true;ne.active=false;syncNameInput(false);state=S.SCORES;}

function handleClick(){
  if(state===S.TITLE){
    var save=getSaveInfo();
    if(inRect(titleBtnRect(0))){if(save&&loadGame())startGame(false);else{sfx("hurt");notify("NO SAVED RUN YET","#ff7675");}}
    else if(inRect(titleBtnRect(1))){selectedMode="regular";state=S.MODE;sfx("switch");}
    else if(inRect(titleBtnRect(2))||mouse.y>570)state=S.SCORES;}
  else if(state===S.MODE){
    if(inRect(modeCardRect("regular"))){selectedMode="regular";sfx("switch");}
    else if(inRect(modeCardRect("hardcore"))){selectedMode="hardcore";sfx("switch");}
    else if(inRect(modeStartRect()))startGame(true,selectedMode);
    else if(inRect(modeBackRect())){state=S.TITLE;sfx("switch");}}
  else if(state===S.PLAY){if(inRect(saveExitRect()))saveForLater();}
  else if(state===S.SHOP){
    for(var t=0;t<shopTabs.length;t++){
      var tx=W/2-shopTabs.length*66+t*132;
      if(mouse.x>tx&&mouse.x<tx+118&&mouse.y>174&&mouse.y<198){shopTab=t;shopNotice(shopTabs[t]+" GARAGE","#cbd5e1");return;}}
    // Check shop item clicks
    var items=getShopItems();
    for(var i=0;i<items.length;i++){
      var card=shopCard(i);
      if(mouse.x>card.x&&mouse.x<card.x+card.w&&mouse.y>card.y&&mouse.y<card.y+card.h){buyShopItem(i);break;}}
    // Continue button
    if(mouse.x>W/2-95&&mouse.x<W/2+95&&mouse.y>H-58&&mouse.y<H-20){regularRetry=false;state=S.PLAY;startLevel();saveGame();}}
  else if(state===S.OVER){
    if(regularRetry){
      if(inRect(overRestartRect()))retryLevel();
      else if(inRect(overSaveRect())){syncNameInput(false);state=S.SHOP;shopNotice("Repair, upgrade, then roll out again.","#cbd5e1");}
      else if(inRect(overTitleRect())){syncNameInput(false);state=S.TITLE;sfx("switch");}
      return;
    }
    if(ne.active){
      if(inRect(overSaveRect()))saveNewHighScore();
      else if(inRect(overRestartRect())){syncNameInput(false);startGame(true);}
      else if(inRect(overTitleRect())){syncNameInput(false);state=S.TITLE;sfx("switch");}}
    else startGame(true);}
  else if(state===S.SCORES)state=S.TITLE;}

// ====== UPDATE ======
function update(){
  if(state!==S.PLAY)return;
  gt++;
  levelTimer++;
	  if(comboT>0)comboT--;else combo=0;
	  if(noticeMsg.time>0)noticeMsg.time--;
	  if(saveNote>0)saveNote--;
	  if(mapIntroT>0)mapIntroT--;
	  if(bossIntroT>0){bossIntroT--;if(bossIntroT%52===0)sfx("line");}
	  if(edgeWarnT>0)edgeWarnT--;
	  if(keys.KeyN){audioOn=!audioOn;if(audioOn){initAudio();sfx("upgrade");}notify(audioOn?"AUDIO ON":"AUDIO OFF","#cbd5e1");keys.KeyN=false;}
	  if(keys.KeyI){inventoryOpen=!inventoryOpen;sfx("inventory");notify(inventoryOpen?"TACTICAL KIT: 1 DEMO / 2 MISSILE":"TACTICAL KIT CLOSED","#cbd5e1");keys.KeyI=false;}
	  if(keys.Digit1||keys.Numpad1){selectSpecial("demo");keys.Digit1=false;keys.Numpad1=false;}
	  if(keys.Digit2||keys.Numpad2){selectSpecial("missile");keys.Digit2=false;keys.Numpad2=false;}

  // Movement
  var mx=0,my=0;
  if(keys.KeyW||keys.ArrowUp)my=-1;if(keys.KeyS||keys.ArrowDown)my=1;
  if(keys.KeyA||keys.ArrowLeft)mx=-1;if(keys.KeyD||keys.ArrowRight)mx=1;
  if(touchCtl.target){updateTouchDriveVector();mx+=touchCtl.mx;my+=touchCtl.my;}
  var ml=Math.sqrt(mx*mx+my*my);if(ml>1){mx/=ml;my/=ml;}
	  var nextX=P.x+mx*effectiveSpeed(),nextY=P.y+my*effectiveSpeed();
	  if(nextX>enemyLineX()&&mx>0.05&&edgeWarnT<=0){edgeWarnT=70;sfx("line");notify("ENEMY LINE - HOLD THIS SIDE","#ff7675");}
	  P.x=nextX;P.y=nextY;
	  P.y=Math.max(25,Math.min(H-25,P.y));P.x=Math.max(25,Math.min(enemyLineX(),P.x));
  if((Math.abs(mx)+Math.abs(my)>0.08)&&gt%3===0){
    particles.push({x:P.x-Math.cos(P.angle)*32+rand(-8,8),y:P.y-Math.sin(P.angle)*24+rand(-16,16),vx:rand(-0.45,0.25),vy:rand(-0.35,0.35),life:38,ml:38,color:"rgba(101,91,70,0.42)",size:rand(8,18)});}
  if(gt%10===0){
    particles.push({x:P.x-Math.cos(P.angle)*34,y:P.y-18,vx:-0.25+rand(-0.3,0.2),vy:-0.55+rand(-0.2,0.1),life:60,ml:60,color:"rgba(50,54,55,0.42)",size:rand(7,15)});}

  // Spawn enemies over time (not all at once)
  if(enemiesSpawned<enemiesThisLevel){
    spawnTimer++;
    if(spawnTimer>Math.max(28,45-phaseIndex()*2-Math.floor(level/18))){spawnTimer=0;enemiesSpawned++;
      var r=Math.random();
      if(r<0.35)spawnEnemy("grunt");else if(r<0.55)spawnEnemy("fast");
      else if(r<0.75)spawnEnemy("tank");else spawnEnemy("sniper");}}
	  // Boss enters only after the regular wave is completely cleared.
	  if(!bossSpawned&&enemiesSpawned>=enemiesThisLevel&&levelKills>=enemiesThisLevel&&enemies.length===0){spawnBoss();}

  // Auto-aim
  var target=findTarget();
  if(target){P.angle=Math.atan2(target.y-P.y,target.x-P.x);fire();}
  if(P.fireCD>0)P.fireCD--;
  if(P.missileCD>0)P.missileCD--;
  if(P.invT>0)P.invT--;
	  if(keys.KeyQ||keys.KeyB){selectSpecial("demo");useBomb();keys.KeyQ=false;keys.KeyB=false;}
	  if(keys.Space){useActiveSpecial();keys.Space=false;}
	  if(keys.KeyM){if(effectiveMissileCap()>0)selectSpecial("missile");fireMissile();keys.KeyM=false;}
  if(base.hitF>0)base.hitF--;
  if((village.turret||0)>0&&enemies.length&&gt%villageTurretRate()===0){
    var bt=findNearestEnemy(base,900);
    if(bt){var ba=Math.atan2(bt.y-base.y,bt.x-base.x);
      baseBullets.push({x:base.x+42,y:base.y-26,vx:Math.cos(ba)*11,vy:Math.sin(ba)*11,life:70,dmg:villageTurretDamage(),color:"#d1d5db"});
      burst(base.x+38,base.y-24,3,"#d1d5db",2,8);}}
  if((village.laser||0)>0&&enemies.length&&gt%villageLaserRate()===0){
    var lt=findNearestEnemy(base,1050),li=enemies.indexOf(lt);
    if(lt&&li>=0){var ld=villageLaserDamage();lt.hp-=ld;lt.hitF=9;
      baseBeams.push({x1:base.x+26,y1:base.y+28,x2:lt.x,y2:lt.y,life:12,ml:12,color:"#5eead4"});
      floatT(lt.x,lt.y-lt.size,Math.round(ld).toString(),"#5eead4",false);burst(lt.x,lt.y,5,"#5eead4",2.5,10);sfx("switch");
      if(lt.hp<=0)killEnemy(li);}}
  if((village.repairBay||0)>0&&gt%Math.max(150,520-(village.repairBay||0)*38)===0){
    drops.push({x:base.x+rand(88,165),y:rand(70,H-70),type:"hp",label:"KIT",color:"#2ed573",life:650,bob:rand(0,6.28)});
    notify("REGEN PACK DEPLOYED","#2ed573");
  }

  // Guided missiles
  for(var i=missiles.length-1;i>=0;i--){
    var m=missiles[i],mt=findNearestEnemy(m,360);
    if(mt){var ta=Math.atan2(mt.y-m.y,mt.x-m.x),sp=Math.sqrt(m.vx*m.vx+m.vy*m.vy);
      m.vx=m.vx*0.91+Math.cos(ta)*sp*0.09;m.vy=m.vy*0.91+Math.sin(ta)*sp*0.09;m.angle=Math.atan2(m.vy,m.vx);}
    m.x+=m.vx;m.y+=m.vy;m.life--;
    if(gt%2===0)particles.push({x:m.x-Math.cos(m.angle)*18,y:m.y-Math.sin(m.angle)*18,
      vx:-Math.cos(m.angle)*0.9+rand(-0.4,0.4),vy:-Math.sin(m.angle)*0.9+rand(-0.4,0.4),
      life:32,ml:32,color:"rgba(95,96,88,0.62)",size:rand(5,12)});
    var hit=false;
    for(var mj=enemies.length-1;mj>=0;mj--){if(dist(m,enemies[mj])<enemies[mj].size+10){detonateMissile(i);hit=true;break;}}
    if(hit)continue;
    if(m.life<=0||m.x>W+80||m.x<-80||m.y<-80||m.y>H+80)detonateMissile(i);
  }

  // Launched demolition charges
  for(var i=charges.length-1;i>=0;i--){
    var ch=charges[i],ct=ch.target&&enemies.indexOf(ch.target)>=0?ch.target:findNearestEnemy(ch,300);
    if(ct){var ca=Math.atan2(ct.y-ch.y,ct.x-ch.x),cs=Math.sqrt(ch.vx*ch.vx+ch.vy*ch.vy);
      ch.vx=ch.vx*0.95+Math.cos(ca)*cs*0.05;ch.vy=ch.vy*0.95+Math.sin(ca)*cs*0.05;ch.angle=Math.atan2(ch.vy,ch.vx);}
    ch.x+=ch.vx;ch.y+=ch.vy;ch.life--;
    if(gt%2===0)particles.push({x:ch.x-Math.cos(ch.angle)*12,y:ch.y-Math.sin(ch.angle)*12,
      vx:-Math.cos(ch.angle)*0.45+rand(-0.25,0.25),vy:-Math.sin(ch.angle)*0.45+rand(-0.25,0.25),
      life:28,ml:28,color:"rgba(58,54,43,0.68)",size:rand(4,10)});
    var detonated=false;
    for(var ci=enemies.length-1;ci>=0;ci--){if(dist(ch,enemies[ci])<enemies[ci].size+18){detonateCharge(i);detonated=true;break;}}
    if(detonated)continue;
    if(ch.life<=0||ch.x>W+80||ch.x<-80||ch.y<-80||ch.y>H+80)detonateCharge(i);
  }

  // Village turret rounds
  for(var i=baseBullets.length-1;i>=0;i--){
    var tb=baseBullets[i];tb.x+=tb.vx;tb.y+=tb.vy;tb.life--;
    if(tb.life<=0||tb.x>W+20||tb.y<-20||tb.y>H+20){baseBullets.splice(i,1);continue;}
    for(var bj=enemies.length-1;bj>=0;bj--){var be=enemies[bj];
      if(dist(tb,be)<be.size+5){be.hp-=tb.dmg;be.hitF=5;burst(tb.x,tb.y,3,"#d1d5db",2.2,8);
        if(be.hp<=0)killEnemy(bj);baseBullets.splice(i,1);break;}}}

  // Bullets (SHORT RANGE - die before leaving screen if range is low)
  for(var i=bullets.length-1;i>=0;i--){
    var b=bullets[i];b.x+=b.vx;b.y+=b.vy;b.life--;
    if(b.life<=0||b.x>W+20||b.x<-20||b.y<-20||b.y>H+20){bullets.splice(i,1);continue;}
    for(var j=enemies.length-1;j>=0;j--){var e=enemies[j];
      if(dist(b,e)<e.size+4){
        var crit=Math.random()<0.15;var dmg=b.dmg*(crit?2.5:1);
        e.hp-=dmg;e.hitF=7;
        sfx("hit");
        floatT(e.x,e.y-e.size,Math.round(dmg).toString(),crit?"#fffa00":"#fff",crit);
        burst(b.x,b.y,3,e.color,2.5,10);cam.shake=Math.max(cam.shake,crit?3.5:1);
        if(b.explosive){explode(b.x,b.y,1.35,"#fbbf24");cam.shake=5;
          for(var k=enemies.length-1;k>=0;k--){if(k!==j&&dist(b,enemies[k])<70){enemies[k].hp-=dmg*0.4;enemies[k].hitF=4;}}}
        if(e.hp<=0)killEnemy(j);

  ctx.fillStyle=selectedMode==="hardcore"?"#f43f5e":"#5eead4";ctx.fillRect(sr.x,sr.y,sr.w,sr.h);

  ctx.fillStyle="rgba(255,255,255,0.1)";ctx.fillRect(br.x,br.y,br.w,br.h);ctx.strokeStyle="rgba(255,255,255,0.2)";ctx.strokeRect(br.x,br.y,br.w,br.h);
  ctx.fillStyle="#cbd5e1";ctx.font="bold 12px monospace";ctx.fillText("BACK",W/2,br.y+22);
  drawNotice();ctx.textAlign="left";
}

  ctx.fillStyle="#cbd5cf";ctx.font="bold 46px monospace";ctx.fillText("ROAD TRIP",W/2,126);
  ctx.fillStyle="#e5e7df";ctx.font="bold 56px monospace";ctx.fillText("RAMPAGE",W/2,188);
  ctx.fillStyle="rgba(255,255,255,0.62)";ctx.font="15px monospace";ctx.fillText("Armored dozer RPG survival campaign",W/2,222);
  ctx.fillStyle="rgba(255,255,255,0.54)";ctx.font="12px monospace";

  else{ctx.fillStyle="rgba(255,255,255,0.38)";ctx.font="bold 11px monospace";ctx.fillText("NO SAVED RUN YET - START A NEW CAMPAIGN",W/2,338);}
  drawTitleButton(0,hasSave?"LOAD OLD GAME - LEVEL "+save.level:"LOAD OLD GAME",hasSave?"continue saved run":"no saved run yet",hasSave,hasSave?"#5eead4":"#64748b");
  drawTitleButton(1,"NEW GAME","choose regular or hardcore",true,"#cbd5e1");
  drawTitleButton(2,"LOCAL LEADERBOARD","tap to view saved scores",true,"#facc15");

  ctx.fillStyle="rgba(7,10,11,0.68)";ctx.fillRect(28,516,404,92);ctx.strokeStyle="rgba(203,213,203,0.18)";ctx.strokeRect(28,516,404,92);
  ctx.textAlign="left";ctx.fillStyle="#cbd5cf";ctx.font="bold 12px monospace";ctx.fillText("FIELD BRIEFING",44,536);
  ctx.fillStyle="rgba(255,255,255,0.52)";ctx.font="11px monospace";

// ====== GAME OVER / SCORES ======
function rOver(){
  syncNameInput(ne.active);
  ctx.fillStyle="rgba(13,15,24,0.95)";ctx.fillRect(0,0,W,H);ctx.textAlign="center";
  if(regularRetry){
    ctx.fillStyle="#5eead4";ctx.font="bold 38px sans-serif";ctx.fillText("LEVEL FAILED",W/2,110);
    ctx.fillStyle="#fff";ctx.font="15px sans-serif";ctx.fillText("REGULAR MODE - retry Level "+level+" without losing the campaign",W/2,155);
    ctx.fillStyle="rgba(255,255,255,0.62)";ctx.font="13px sans-serif";ctx.fillText(vehicleDef().name+" R"+vehicleRank(currentVehicle)+" | "+paintDef().name+" | Garage and save remain available",W/2,184);
    var gr=overSaveRect(),rr=overRestartRect(),tr=overTitleRect();
    ctx.fillStyle="rgba(250,204,21,0.9)";ctx.fillRect(gr.x,gr.y,gr.w,gr.h);
    ctx.fillStyle="rgba(94,234,212,0.9)";ctx.fillRect(rr.x,rr.y,rr.w,rr.h);
    ctx.fillStyle="rgba(255,255,255,0.12)";ctx.fillRect(tr.x,tr.y,tr.w,tr.h);
    ctx.strokeStyle="rgba(255,255,255,0.28)";ctx.strokeRect(gr.x,gr.y,gr.w,gr.h);ctx.strokeRect(rr.x,rr.y,rr.w,rr.h);ctx.strokeRect(tr.x,tr.y,tr.w,tr.h);
    ctx.fillStyle="#061016";ctx.font="bold 13px sans-serif";ctx.fillText("GARAGE",gr.x+gr.w/2,gr.y+27);
    ctx.fillText("RETRY LEVEL",rr.x+rr.w/2,rr.y+27);
    ctx.fillStyle="#cbd5e1";ctx.fillText("TITLE",tr.x+tr.w/2,tr.y+27);
    ctx.fillStyle="rgba(255,255,255,0.38)";ctx.font="11px sans-serif";ctx.fillText("R or Space retries | T returns to title",W/2,448);
    if(keys.KeyR||keys.Space){retryLevel();keys.KeyR=false;keys.Space=false;}if(keys.KeyT){state=S.TITLE;keys.KeyT=false;}
    ctx.textAlign="left";return;
  }
  ctx.fillStyle=runWon?"#5eead4":"#ff4757";ctx.font="bold 38px sans-serif";ctx.fillText(runWon?"CAMPAIGN COMPLETE":"MISSION OVER",W/2,110);
  ctx.fillStyle="#fff";ctx.font="15px sans-serif";
  ctx.fillText("Reached Level "+level+"/"+MAX_LEVEL+" | Score: "+totalScore.toLocaleString()+" | Final Kills: "+levelKills,W/2,155);
  ctx.fillStyle="rgba(255,255,255,0.62)";ctx.font="13px sans-serif";
  ctx.fillText(vehicleDef().name+" R"+vehicleRank(currentVehicle)+" | "+skinDef().name+" | Hull "+effectiveMaxHp()+" | Repair/Kill "+P.regen,W/2,184);
  if(ne.active){ctx.fillStyle="#fffa00";ctx.font="bold 16px sans-serif";ctx.fillText("OPTIONAL: SAVE YOUR SCORE",W/2,226);
    ctx.fillStyle="rgba(255,255,255,0.45)";ctx.font="12px sans-serif";ctx.fillText("Type any name, or skip it and restart instantly.",W/2,258);
    var sr=overSaveRect(),rr=overRestartRect(),tr=overTitleRect();
    ctx.fillStyle="rgba(46,213,115,0.88)";ctx.fillRect(sr.x,sr.y,sr.w,sr.h);
    ctx.fillStyle="rgba(203,213,225,0.88)";ctx.fillRect(rr.x,rr.y,rr.w,rr.h);
    ctx.fillStyle="rgba(255,255,255,0.12)";ctx.fillRect(tr.x,tr.y,tr.w,tr.h);
    ctx.strokeStyle="rgba(255,255,255,0.28)";ctx.strokeRect(sr.x,sr.y,sr.w,sr.h);ctx.strokeRect(rr.x,rr.y,rr.w,rr.h);ctx.strokeRect(tr.x,tr.y,tr.w,tr.h);
    ctx.fillStyle="#061016";ctx.font="bold 13px sans-serif";ctx.fillText("SAVE SCORE",sr.x+sr.w/2,sr.y+27);
    ctx.fillText("RESTART",rr.x+rr.w/2,rr.y+27);
    ctx.fillStyle="#cbd5e1";ctx.fillText("TITLE",tr.x+tr.w/2,tr.y+27);
    ctx.fillStyle="rgba(255,255,255,0.38)";ctx.font="11px sans-serif";ctx.fillText("Enter saves | R or Space restarts | T returns to title",W/2,448);
    if(keys.Enter){saveNewHighScore();keys.Enter=false;}if(keys.KeyR||keys.Space){syncNameInput(false);startGame(true);keys.KeyR=false;keys.Space=false;}if(keys.KeyT){syncNameInput(false);state=S.TITLE;keys.KeyT=false;}}
  else{ctx.fillStyle="rgba(255,255,255,0.4)";ctx.font="13px sans-serif";ctx.fillText("Score saved. Click to retry | T: Title",W/2,300);
    if(keys.KeyT){state=S.TITLE;keys.KeyT=false;}if(keys.Space||keys.KeyR){startGame(true);keys.Space=false;keys.KeyR=false;}}ctx.textAlign="left";}

function rScores(){
  ctx.fillStyle="#0d0f18";ctx.fillRect(0,0,W,H);ctx.textAlign="center";

  for(var i=0;i<hs.length;i++){ctx.fillStyle=cols[Math.min(i,cols.length-1)];ctx.font="bold 17px monospace";
    ctx.fillText((i+1)+". "+hs[i].n+"  "+hs[i].s.toLocaleString()+"  L"+(hs[i].l||"-"),W/2,125+i*39);}
  ctx.fillStyle="rgba(255,255,255,0.3)";ctx.font="12px sans-serif";ctx.fillText("Tap or click to return",W/2,H-35);
  ctx.textAlign="left";if(keys.KeyT||keys.Space){state=S.TITLE;keys.KeyT=false;keys.Space=false;}}

loop();
})();
