function phaseIndex(){return Math.min(PHASES.length-1,Math.floor((Math.max(1,level)-1)/10));}
function phase(){return PHASES[phaseIndex()];}
function mapTier(){return phaseIndex()+1;}
function levelInMap(){return ((Math.max(1,level)-1)%10)+1;}
function isMajorBossLevel(){return level%10===0;}
function bossNameForLevel(){return isMajorBossLevel()?phase().boss:"Field Commander";}
function bossFeatureText(){return isMajorBossLevel()?phase().power:"mobile cannon pressure";}
function fmtClock(frames){var s=Math.floor(frames/60),m=Math.floor(s/60);s%=60;return (m<10?"0":"")+m+":"+(s<10?"0":"")+s;}
function vehicleRank(id){return vehicleRanks[id]||1;}
function vehicleDef(){return VEHICLES[currentVehicle]||VEHICLES.dozer1;}
function baseSkinDef(id){return TANK_SKINS[id||currentSkin]||TANK_SKINS.factory;}
function paintDef(id){return PAINTS[id||currentPaint]||PAINTS.gunmetal;}
function skinDef(id){
  var sk=Object.assign({},baseSkinDef(id));
  if(!id||id===currentSkin){
    var p=paintDef();
    if(p.body){sk.body=p.body;sk.cab=p.cab;sk.blade=p.blade;sk.stripe=p.stripe;sk.accent=p.accent;sk.glow=p.glow;sk.diamond=!!p.diamond;}
  }
  return sk;
}
function upgradeLevel(id){return upgradeLevels[id]||0;}
function vehicleRankBonus(mult){return Math.max(0,vehicleRank(currentVehicle)-1)*mult;}
function effectiveMaxHp(){var v=vehicleDef();return Math.round(P.maxHp+v.hp+vehicleRankBonus(22));}
function effectiveArmor(){var v=vehicleDef();return Math.round(P.armor+(P.boostArmor||0)+v.armor+vehicleRankBonus(4));}
function effectiveDmg(){var v=vehicleDef();return Math.round(P.dmg+(P.boostDmg||0)+v.dmg+vehicleRankBonus(3));}
function effectiveSpeed(){var v=vehicleDef();return Math.max(2.8,Math.min(8.6,P.speed+v.speed+vehicleRankBonus(0.04)));}
function effectiveMissileCap(){var v=vehicleDef();return Math.max(0,P.missileCap+v.missile);}
function effectiveRepair(){return P.regen+(P.boostRepair||0)+(vehicleDef().repair||0)+(village.medic||0)*2;}
function villageMaxHp(){return 130+(village.wall||0)*42+(village.workshop||0)*12;}
function villageTurretRate(){return Math.max(18,64-(village.turret||0)*6);}
function villageTurretDamage(){return 10+(village.turret||0)*8+(village.workshop||0)*2;}
function villageLaserRate(){return Math.max(26,94-(village.laser||0)*8-(vehicleDef().laser||0)*4);}
function villageLaserDamage(){return 18+(village.laser||0)*18+(village.workshop||0)*3+(vehicleDef().laser||0)*10;}
function baseShieldReduction(){return (village.shield||0)*5;}

function contractStreakTarget(){return Math.min(28,5+phaseIndex()*3+Math.floor(level/9));}
function contractArmorTarget(){return Math.min(8,1+phaseIndex()+Math.floor(level/18));}
function operationContracts(){
  return[
    {name:"Hold The Line",desc:"Village 70%+",reward:2+phaseIndex(),done:function(){return base.max>0&&base.hp/base.max>=0.7;},progress:function(){return Math.max(0,Math.round(base.hp/base.max*100))+"%";}},
    {name:"Kill Chain",desc:"Streak "+contractStreakTarget(),reward:2+phaseIndex(),done:function(){return runStats.maxCombo>=contractStreakTarget();},progress:function(){return runStats.maxCombo+"/"+contractStreakTarget();}},
    {name:"Armor Breaker",desc:"Heavy kills "+contractArmorTarget(),reward:3+phaseIndex(),done:function(){return runStats.tankKills+runStats.bossKills>=contractArmorTarget();},progress:function(){return (runStats.tankKills+runStats.bossKills)+"/"+contractArmorTarget();}}
  ];
}
function awardContracts(){
  var list=operationContracts(),bonus=0,done=0;
  for(var i=0;i<list.length;i++){if(list[i].done()){done++;bonus+=list[i].reward;}}
  if(bonus>0){credits+=bonus;totalScore+=bonus*120;}
  lastOpReport="CONTRACTS "+done+"/"+list.length+(bonus>0?"  +"+bonus+" CREDITS":"");
  return{done:done,total:list.length,bonus:bonus};
}

function buyShopItem(i){
  sfx("upgrade");
  var it=getShopItems()[i],cost=itemCost(it);
  if(itemLocked(it)){shopNotice(itemName(it)+" unlocks at level "+itemUnlockLevel(it),"#ff7675");return;}
  if(itemBlocked(it)){shopNotice(itemName(it)+" needs an earlier system first","#ff7675");return;}
  if(it.boost){
    if(credits<cost){shopNotice("Need "+(cost-credits)+" more credits for "+it.name,"#ff7675");return;}
    credits-=cost;
    var bmsg=it.apply();
    shopNotice(bmsg,"#facc15");notify(bmsg,"#facc15");saveGame();return;
  }
  if(it.skin){
    var sid=it.skin,sk=TANK_SKINS[sid];
    if(!ownedSkins[sid]){
      if(credits<cost){shopNotice("Need "+(cost-credits)+" more credits to unlock "+sk.name,"#ff7675");return;}
      credits-=cost;ownedSkins[sid]=true;currentSkin=sid;
      shopNotice(sk.name+" style unlocked and equipped","#facc15");notify("NEW STYLE: "+sk.name,"#facc15");saveGame();return;
    }
    currentSkin=sid;shopNotice(sk.name+" style equipped","#5eead4");notify("STYLE: "+sk.name,"#5eead4");saveGame();return;
  }
  if(it.paint){
    var pid=it.paint,pt=PAINTS[pid];
    if(!ownedPaints[pid]){
      if(credits<cost){shopNotice("Need "+(cost-credits)+" more credits to unlock "+pt.name,"#ff7675");return;}
      credits-=cost;ownedPaints[pid]=true;currentPaint=pid;
      shopNotice(pt.name+" paint unlocked and applied","#facc15");notify("CUSTOM PAINT: "+pt.name,"#facc15");saveGame();return;
    }
    currentPaint=pid;shopNotice(pt.name+" paint applied","#5eead4");notify("PAINT: "+pt.name,"#5eead4");saveGame();return;
  }
  if(itemOwned(it)){shopNotice(itemName(it)+" already installed","#facc15");return;}
  if(itemMaxed(it)){shopNotice(itemName(it)+" is fully upgraded","#facc15");return;}
  if(it.vehicle){
    var vid=it.vehicle,v=VEHICLES[vid];
    if(!ownedVehicles[vid]){
      if(credits<cost){shopNotice("Need "+(cost-credits)+" more credits to buy "+v.name,"#ff7675");return;}
      credits-=cost;ownedVehicles[vid]=true;vehicleRanks[vid]=1;currentVehicle=vid;P.hp=effectiveMaxHp();
      shopNotice(v.name+" purchased and deployed","#facc15");notify("NEW CHASSIS: "+v.name,"#facc15");saveGame();return;
    }
    if(currentVehicle!==vid){currentVehicle=vid;P.hp=effectiveMaxHp();shopNotice(v.name+" deployed","#cbd5e1");notify("CHASSIS: "+v.name,"#cbd5e1");saveGame();return;}
    if(credits<cost){shopNotice("Need "+(cost-credits)+" more credits to rank up "+v.name,"#ff7675");return;}
    credits-=cost;vehicleRanks[vid]++;
    P.hp=effectiveMaxHp();shopNotice(v.name+" ranked to "+vehicleRank(vid),"#facc15");notify(v.name+" RANK "+vehicleRank(vid),"#facc15");saveGame();return;
  }
  if(it.weapon){
    var id=it.weapon,w=WEAPONS[id];
    if(!ownedWeapons[id]){
      if(credits<cost){shopNotice("Need "+(cost-credits)+" more credits to unlock "+w.name,"#ff7675");return;}
      credits-=cost;ownedWeapons[id]=true;weaponLevels[id]=1;P.weapon=id;
      shopNotice(w.name+" unlocked and equipped","#facc15");notify("UNLOCKED: "+w.name,"#facc15");saveGame();return;
    }
    if(P.weapon!==id){P.weapon=id;shopNotice(w.name+" equipped","#5eead4");notify("WEAPON: "+w.name,"#5eead4");saveGame();return;}
    if(weaponLevel(id)>=(w.maxLv||5)){shopNotice(w.name+" is fully upgraded","#facc15");return;}
    if(credits<cost){shopNotice("Need "+(cost-credits)+" more credits to upgrade "+w.name,"#ff7675");return;}
    credits-=cost;weaponLevels[id]++;
    shopNotice(w.name+" upgraded to Lv."+weaponLevel(id),"#facc15");notify(w.name+" LV."+weaponLevel(id),"#facc15");saveGame();return;
  }
  if(credits<cost){shopNotice("Need "+(cost-credits)+" more credits for "+it.name,"#ff7675");return;}
  credits-=cost;
  var msg=it.apply();
  if(it.maxLv)upgradeLevels[it.id]=Math.min(it.maxLv,upgradeLevel(it.id)+1);
  shopNotice(msg,"#facc15");notify(msg,"#facc15");saveGame();
}

// ====== AUTO-AIM (limited range!) ======
function findTarget(){
  var best=null,bestD=Infinity;
  for(var i=0;i<enemies.length;i++){var d=dist(P,enemies[i]);
    // Only target enemies within bullet range (on screen, not too far)
    if(d<560&&d<bestD){bestD=d;best=enemies[i];}}
  return best;}
function findNearestEnemy(from,maxD){
  var best=null,bestD=maxD||Infinity;
  for(var i=0;i<enemies.length;i++){var d=dist(from,enemies[i]);if(d<bestD){bestD=d;best=enemies[i];}}
  return best;}

// ====== FIRE ======
function fire(){
  if(P.fireCD>0)return;
  var w=WEAPONS[P.weapon],wl=weaponLevel(P.weapon),power=weaponPower(P.weapon);
  P.fireCD=Math.max(2,Math.round(w.rate*(10/P.fireRate)/(1+wl*0.04)));
  cam.shake=Math.max(cam.shake,1.5);
  var shots=w.count+(P.weapon==="shotgun"&&wl>=4?1:0);
  for(var i=0;i<shots;i++){
    var spread=rand(-1,1)*w.spread;
    var angle=P.angle+spread;
    var bx=P.x+Math.cos(P.angle)*24,by=P.y+Math.sin(P.angle)*24;
    bullets.push({x:bx,y:by,vx:Math.cos(angle)*w.speed,vy:Math.sin(angle)*w.speed,
      dmg:effectiveDmg()*w.dmg*power,life:P.bulletRange*w.range*(1+wl*0.035),color:w.color,explosive:w.explosive||false,lvl:wl});}
  if(gt%3===0)sfx("fire");
  burst(P.x+Math.cos(P.angle)*26,P.y+Math.sin(P.angle)*26,2,"#fff",2.5,4);}

function fireMissile(){
  if(effectiveMissileCap()<=0){notify("MISSILE POD LOCKED","#ff7675");return false;}
  if(P.missileCD>0){notify("MISSILE RELOADING","#ff7675");return false;}
  if(P.missiles<=0){notify("NO MISSILES LEFT","#ff7675");return false;}
  var target=findTarget(),angle=target?Math.atan2(target.y-P.y,target.x-P.x):driveAngle();
  var speed=8.4+(P.missilePower||1)*0.45;
  P.missiles--;P.missileCD=Math.max(32,96-(P.missilePower||1)*7);
  runStats.missilesFired++;

    vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed,angle:angle,life:105,ml:105,
    dmg:140+effectiveDmg()*3+(P.missilePower||1)*52,radius:96+(P.missilePower||1)*14,color:"#fb923c"});

}

function detonateMissile(idx){

    else if(inRect(modeStartRect()))startGame(true,selectedMode);

    for(var t=0;t<shopTabs.length;t++){
      var tx=W/2-shopTabs.length*66+t*132;
      if(mouse.x>tx&&mouse.x<tx+118&&mouse.y>174&&mouse.y<198){shopTab=t;shopNotice(shopTabs[t]+" GARAGE","#cbd5e1");return;}}

    ctx.fillStyle="#cbd5e1";ctx.fillText("TITLE",tr.x+tr.w/2,tr.y+27);
    ctx.fillStyle="rgba(255,255,255,0.38)";ctx.font="11px sans-serif";ctx.fillText("R or Space retries | T returns to title",W/2,448);
    if(keys.KeyR||keys.Space){retryLevel();keys.KeyR=false;keys.Space=false;}if(keys.KeyT){state=S.TITLE;keys.KeyT=false;}
    ctx.textAlign="left";return;
  }
  ctx.fillStyle=runWon?"#5eead4":"#ff4757";ctx.font="bold 38px sans-serif";ctx.fillText(runWon?"CAMPAIGN COMPLETE":"MISSION OVER",W/2,110);
  ctx.fillStyle="#fff";ctx.font="15px sans-serif";
  ctx.fillText("Reached Level "+level+"/"+MAX_LEVEL+" | Score: "+totalScore.toLocaleString()+" | Final Kills: "+levelKills,W/2,155);
  ctx.fillStyle="rgba(255,255,255,0.62)";ctx.font="13px sans-serif";
  ctx.fillText(vehicleDef().name+" R"+vehicleRank(currentVehicle)+" | "+skinDef().name+" | Hull "+effectiveMaxHp()+" | Repair/Kill "+P.regen,W/2,184);
  if(ne.active){ctx.fillStyle="#fffa00";ctx.font="bold 16px sans-serif";ctx.fillText("OPTIONAL: SAVE YOUR SCORE",W/2,226);
    ctx.fillStyle="rgba(255,255,255,0.45)";ctx.font="12px sans-serif";ctx.fillText("Type any name, or skip it and restart instantly.",W/2,258);
    var sr=overSaveRect(),rr=overRestartRect(),tr=overTitleRect();
    ctx.fillStyle="rgba(46,213,115,0.88)";ctx.fillRect(sr.x,sr.y,sr.w,sr.h);
    ctx.fillStyle="rgba(203,213,225,0.88)";ctx.fillRect(rr.x,rr.y,rr.w,rr.h);
    ctx.fillStyle="rgba(255,255,255,0.12)";ctx.fillRect(tr.x,tr.y,tr.w,tr.h);
    ctx.strokeStyle="rgba(255,255,255,0.28)";ctx.strokeRect(sr.x,sr.y,sr.w,sr.h);ctx.strokeRect(rr.x,rr.y,rr.w,rr.h);ctx.strokeRect(tr.x,tr.y,tr.w,tr.h);
    ctx.fillStyle="#061016";ctx.font="bold 13px sans-serif";ctx.fillText("SAVE SCORE",sr.x+sr.w/2,sr.y+27);
    ctx.fillText("RESTART",rr.x+rr.w/2,rr.y+27);
    ctx.fillStyle="#cbd5e1";ctx.fillText("TITLE",tr.x+tr.w/2,tr.y+27);
    ctx.fillStyle="rgba(255,255,255,0.38)";ctx.font="11px sans-serif";ctx.fillText("Enter saves | R or Space restarts | T returns to title",W/2,448);
    if(keys.Enter){saveNewHighScore();keys.Enter=false;}if(keys.KeyR||keys.Space){syncNameInput(false);startGame(true);keys.KeyR=false;keys.Space=false;}if(keys.KeyT){syncNameInput(false);state=S.TITLE;keys.KeyT=false;}}
  else{ctx.fillStyle="rgba(255,255,255,0.4)";ctx.font="13px sans-serif";ctx.fillText("Score saved. Click to retry | T: Title",W/2,300);
    if(keys.KeyT){state=S.TITLE;keys.KeyT=false;}if(keys.Space||keys.KeyR){startGame(true);keys.Space=false;keys.KeyR=false;}}ctx.textAlign="left";}

function rScores(){
  ctx.fillStyle="#0d0f18";ctx.fillRect(0,0,W,H);ctx.textAlign="center";
  ctx.fillStyle="#74b9ff";ctx.font="bold 28px sans-serif";ctx.fillText("LOCAL HIGH SCORES",W/2,75);
  var cols=["#fffa00","#ccc","#cd7f32","rgba(255,255,255,0.5)","rgba(255,255,255,0.3)"];
  for(var i=0;i<hs.length;i++){ctx.fillStyle=cols[Math.min(i,cols.length-1)];ctx.font="bold 17px monospace";
    ctx.fillText((i+1)+". "+hs[i].n+"  "+hs[i].s.toLocaleString()+"  L"+(hs[i].l||"-"),W/2,125+i*39);}
  ctx.fillStyle="rgba(255,255,255,0.3)";ctx.font="12px sans-serif";ctx.fillText("Tap or click to return",W/2,H-35);
  ctx.textAlign="left";if(keys.KeyT||keys.Space){state=S.TITLE;keys.KeyT=false;keys.Space=false;}}

function loop(){update();render();requestAnimationFrame(loop);}
loop();
})();
</script>
