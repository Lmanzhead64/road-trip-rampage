function initAudio(){
  if(!audioOn)return null;
  if(audioCtx)return audioCtx;
  try{
    var AC=window.AudioContext||window.webkitAudioContext;if(!AC)return null;
    audioCtx=new AC();audioMaster=audioCtx.createGain();audioComp=audioCtx.createDynamicsCompressor();
    audioMaster.gain.value=0.36;audioMaster.connect(audioComp);audioComp.connect(audioCtx.destination);
  }catch(e){audioCtx=null;}
  return audioCtx;
}
function tone(freq,dur,type,gain,slide){
  var ac=initAudio();if(!ac||!audioMaster)return;
  var o=ac.createOscillator(),g=ac.createGain(),now=ac.currentTime;
  o.type=type||"sine";o.frequency.setValueAtTime(freq,now);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(20,freq*slide),now+dur);
  g.gain.setValueAtTime(gain||0.08,now);g.gain.exponentialRampToValueAtTime(0.0001,now+dur);
  o.connect(g);g.connect(audioMaster);o.start(now);o.stop(now+dur+.02);
}
function noise(dur,gain,cut){
  var ac=initAudio();if(!ac||!audioMaster)return;
  var len=Math.max(1,Math.floor(ac.sampleRate*dur)),buf=ac.createBuffer(1,len,ac.sampleRate),data=buf.getChannelData(0);
  for(var i=0;i<len;i++)data[i]=(Math.random()*2-1)*(1-i/len);
  var src=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain(),now=ac.currentTime;
  src.buffer=buf;f.type="lowpass";f.frequency.value=cut||900;g.gain.value=gain||0.08;
  src.connect(f);f.connect(g);g.connect(audioMaster);src.start(now);
}
function sfx(id){
  if(!audioOn)return;

  else if(id==="boom"){tone(42,.52,"sine",.22,.36);tone(78,.27,"sawtooth",.13,.62);noise(.56,.25,480);}

  else if(id==="save"){tone(260,.09,"sine",.05,1.15);setTimeout(function(){tone(390,.11,"sine",.045,1.12);},90);}

  else if(id==="hurt"){tone(74,.14,"sawtooth",.08,.55);}
}
function hRand(n){var x=Math.sin(n*12.9898+78.233)*43758.5453;return x-Math.floor(x);}
function makeTexture(name,w,h,base,flecks){
  if(!document.createElement)return null;
  var cn=document.createElement("canvas"),cx=cn.getContext("2d");cn.width=w;cn.height=h;
  cx.fillStyle=base;cx.fillRect(0,0,w,h);
  for(var i=0;i<flecks;i++){var r=hRand(i+name.length*91),x=Math.floor(hRand(i+7)*w),y=Math.floor(hRand(i+13)*h),a=0.05+hRand(i+29)*0.2;
    cx.fillStyle=r>0.5?"rgba(255,255,255,"+a+")":"rgba(0,0,0,"+a+")";cx.fillRect(x,y,1+hRand(i+41)*3,1+hRand(i+53)*3);}
  return ctx.createPattern(cn,"repeat");
}
function initTextures(){
  if(TEX.asphalt)return;
  TEX.asphalt=makeTexture("asphalt",96,96,"#15191b",520);
  TEX.dirt=makeTexture("dirt",96,96,"#514a3b",430);
  TEX.steel=makeTexture("steel",64,64,"#2d3436",280);
  TEX.concrete=makeTexture("concrete",64,64,"#77796f",300);
}
function fillTex(id,x,y,w,h,alpha){initTextures();if(!TEX[id])return;ctx.save();ctx.globalAlpha=alpha;ctx.fillStyle=TEX[id];ctx.fillRect(x,y,w,h);ctx.restore();}

function canvasPoint(clientX,clientY){var r=c.getBoundingClientRect();

function uiScale(){var r=c.getBoundingClientRect();return Math.min(2.6,Math.max(1,W/Math.max(1,r.width)));}
function touchTestMode(){return location.search.indexOf("touch=1")!==-1;}

function touchLayout(){var s=uiScale(),compact=compactTouchView(),pad=24*s,joyR=(compact?58:70)*s,btnR=(compact?42:52)*s;

    bombX:bombX,bombY:bombY,bombR:btnR,compact:compact,
    missileX:compact?bombX-btnR*2-18*s:bombX,
    missileY:compact?bombY:H-pad-btnR*3-24*s,missileR:btnR*.88};}
function isTouchDevice(){return touchCtl.seen||navigator.maxTouchPoints>0||("ontouchstart"in window)||touchTestMode();}
function clearTouchMove(){touchCtl.moveId=null;touchCtl.mx=0;touchCtl.my=0;touchCtl.target=false;touchCtl.holding=false;touchCtl.tx=null;touchCtl.ty=null;}
function setTouchMove(p){
  var l=touchLayout();
  touchCtl.target=true;touchCtl.holding=true;touchCtl.tx=p.x;touchCtl.ty=p.y;touchCtl.cx=p.x;touchCtl.cy=p.y;touchCtl.pulse=18;
  updateTouchDriveVector();
}
function updateTouchDriveVector(){
  if(!touchCtl.target||touchCtl.tx===null||touchCtl.ty===null){touchCtl.mx=0;touchCtl.my=0;return;}
  var l=touchLayout(),dx=touchCtl.tx-P.x,dy=touchCtl.ty-P.y,d=Math.sqrt(dx*dx+dy*dy),stop=26*l.s;
  touchCtl.sx=P.x;touchCtl.sy=P.y;touchCtl.cx=touchCtl.tx;touchCtl.cy=touchCtl.ty;
  if(d<stop){touchCtl.mx=0;touchCtl.my=0;if(!touchCtl.holding)clearTouchMove();return;}
  var nx=dx/d,ny=dy/d,full=145*l.s,str=Math.min(1,Math.max(0.34,(d-stop)/(full-stop)));
  touchCtl.mx=nx*str;touchCtl.my=ny*str;
}
function beginInput(id,p,kind){initAudio();touchCtl.seen=touchCtl.seen||kind==="touch";
  if(state!==S.PLAY){handleClick();return;}
  if(inRect(saveExitRect())){saveForLater();return;}
  var l=touchLayout(),bd=Math.sqrt((p.x-l.bombX)*(p.x-l.bombX)+(p.y-l.bombY)*(p.y-l.bombY));
  var md=Math.sqrt((p.x-l.missileX)*(p.x-l.missileX)+(p.y-l.missileY)*(p.y-l.missileY));
	  if(md<l.missileR+24*l.s){touchCtl.missileId=id;if(effectiveMissileCap()>0)specialMode="missile";fireMissile();return;}
	  if(bd<l.bombR+24*l.s){touchCtl.bombId=id;specialMode="demo";useBomb();return;}
  var touchLike=kind!=="mouse"||touchTestMode();touchCtl.seen=touchCtl.seen||touchLike;
  if(touchLike&&(touchCtl.moveId===null||!touchCtl.holding)){
    touchCtl.moveId=id;setTouchMove(p);}}
function moveInput(id,p){if(id===touchCtl.moveId)setTouchMove(p);}
function endInput(id){if(id===touchCtl.moveId){touchCtl.moveId=null;touchCtl.holding=false;}if(id===touchCtl.bombId)touchCtl.bombId=null;if(id===touchCtl.missileId)touchCtl.missileId=null;}

  c.addEventListener("pointerdown",function(e){e.preventDefault();var p=canvasPoint(e.clientX,e.clientY);
    try{c.setPointerCapture(e.pointerId);}catch(err){}beginInput(e.pointerId,p,e.pointerType==="mouse"?"mouse":"touch");},{passive:false});

}

function weaponLocked(id){var w=WEAPONS[id];return level<(w.unlockLevel||1);}
function itemUnlockLevel(it){return it.weapon?(WEAPONS[it.weapon].unlockLevel||1):it.vehicle?(VEHICLES[it.vehicle].unlockLevel||1):it.skin?(TANK_SKINS[it.skin].unlockLevel||1):(it.unlockLevel||1);}
function itemLocked(it){return level<itemUnlockLevel(it);}
function itemBlocked(it){return !!(it.requires&&!it.requires());}
function itemOwned(it){return !!(it.once&&it.owned&&it.owned());}
function itemMaxed(it){if(it.skin)return false;if(it.vehicle)return ownedVehicles[it.vehicle]&&vehicleRank(it.vehicle)>=(VEHICLES[it.vehicle].maxRank||5);if(it.villageKey)return (village[it.villageKey]||0)>=(it.maxLv||10);if(it.maxLv)return upgradeLevel(it.id)>=(it.maxLv||99);return !!(it.maxed&&it.maxed());}
function itemName(it){return it.vehicle?VEHICLES[it.vehicle].name:it.skin?TANK_SKINS[it.skin].name:it.name;}
function coreUpgradeCost(it){var lv=upgradeLevel(it.id),phaseTax=1+phaseIndex()*0.12;return Math.round((it.cost||1)*(1+lv*0.58)*phaseTax);}
function nextUnlockText(){
  var next=[];
  var items=allShopItems();
  for(var i=0;i<items.length;i++){var l=itemUnlockLevel(items[i]),nm=itemName(items[i]);if(l>level)next.push({l:l,n:nm});}
  next.sort(function(a,b){return a.l-b.l;});
  return next.length?"NEXT UNLOCK L"+next[0].l+": "+next[0].n:"ALL CORE SYSTEMS UNLOCKED";
}
function itemCost(it){
  if(it.skin){var sk=TANK_SKINS[it.skin];return ownedSkins[it.skin]?0:sk.cost;}
  if(it.vehicle){var v=VEHICLES[it.vehicle];if(!ownedVehicles[it.vehicle])return v.cost;if(currentVehicle===it.vehicle&&!itemMaxed(it))return Math.round(v.upgradeBase*(vehicleRank(it.vehicle)+0.85));return 0;}
  if(!it.weapon){if(itemOwned(it)||itemMaxed(it))return 0;return it.costFunc?it.costFunc():it.maxLv?coreUpgradeCost(it):it.cost;}
  var id=it.weapon,w=WEAPONS[id];
  if(!ownedWeapons[id])return w.unlockCost||it.cost;
  if(P.weapon===id&&weaponLevel(id)<(w.maxLv||5))return weaponUpgradeCost(id);
  return 0;
}
function itemAction(it){
  if(itemLocked(it))return "LOCKED L"+itemUnlockLevel(it);
  if(itemBlocked(it))return "REQUIRES";
  if(itemOwned(it))return "OWNED";
  if(itemMaxed(it))return "MAXED";
  if(it.skin){if(!ownedSkins[it.skin])return "UNLOCK";return currentSkin===it.skin?"ACTIVE":"EQUIP";}
  if(it.vehicle){if(!ownedVehicles[it.vehicle])return "BUY";return currentVehicle===it.vehicle?"RANK UP":"EQUIP";}
  if(it.villageKey)return "UPGRADE";
  if(it.weapon){var id=it.weapon,w=WEAPONS[id];
    if(!ownedWeapons[id])return "UNLOCK";
    if(P.weapon===id)return weaponLevel(id)>=(w.maxLv||5)?"MAXED":"UPGRADE";
    return "EQUIP";}
  return it.maxLv?"STACK":"UPGRADE";
}
function itemEffectText(it){
  if(it.skin)return "VISUAL STYLE - STATS STAY STACKED";
  if(it.vehicle){var v=VEHICLES[it.vehicle];return "+HULL "+v.hp+"  +ARM "+v.armor+"  +DMG "+v.dmg;}
  if(it.weapon){var w=WEAPONS[it.weapon];return "WEAPON LV "+weaponLevel(it.weapon)+"/"+(w.maxLv||5)+" - LEVELS STAY";}
  if(it.villageKey)return it.desc.toUpperCase();
  return it.effect||it.desc;
}
function itemProgressText(it){
  if(itemLocked(it))return "Unlocks at level "+itemUnlockLevel(it);
  if(itemBlocked(it))return "Requires Missile Pod";
  if(it.skin)return ownedSkins[it.skin]?(currentSkin===it.skin?"ACTIVE PAINT":"OWNED PAINT"):"COSMETIC UNLOCK";
  if(it.vehicle)return (ownedVehicles[it.vehicle]?(currentVehicle===it.vehicle?"DEPLOYED":"OWNED"):"NEW CHASSIS")+" R"+vehicleRank(it.vehicle)+"/"+(VEHICLES[it.vehicle].maxRank||5);
  if(it.villageKey)return "Village Lv."+((village[it.villageKey]||0))+"/"+(it.maxLv||10);
  if(it.weapon)return ownedWeapons[it.weapon]?(P.weapon===it.weapon?"EQUIPPED":"OWNED"):"LOCKED WEAPON";
  if(itemOwned(it))return "INSTALLED";
  if(itemMaxed(it))return "MAXED";
  return it.maxLv?"Stack Lv."+upgradeLevel(it.id)+"/"+it.maxLv:"STACKS";
}
function specialLabel(){return effectiveMissileCap()>0&&specialMode==="missile"?"MISSILE":"DEMO";}
function selectSpecial(mode){
  if(mode==="missile"&&effectiveMissileCap()<=0){notify("MISSILE POD LOCKED","#ff7675");sfx("hurt");return;}
  specialMode=mode;inventoryOpen=true;sfx("switch");notify("SPACE SET TO "+specialLabel(),"#5eead4");saveGame();
}
function useActiveSpecial(){
  if(effectiveMissileCap()>0&&specialMode==="missile")return fireMissile();
  return useBomb();
}
function buyShopItem(i){
  sfx("upgrade");
  var it=getShopItems()[i],cost=itemCost(it);
  if(itemLocked(it)){shopNotice(itemName(it)+" unlocks at level "+itemUnlockLevel(it),"#ff7675");return;}
  if(itemBlocked(it)){shopNotice(itemName(it)+" needs an earlier system first","#ff7675");return;}
  if(it.skin){
    var sid=it.skin,sk=TANK_SKINS[sid];
    if(!ownedSkins[sid]){
      if(credits<cost){shopNotice("Need "+(cost-credits)+" more credits to unlock "+sk.name,"#ff7675");return;}
      credits-=cost;ownedSkins[sid]=true;currentSkin=sid;
      shopNotice(sk.name+" style unlocked and equipped","#facc15");notify("NEW STYLE: "+sk.name,"#facc15");saveGame();return;
    }
    currentSkin=sid;shopNotice(sk.name+" style equipped","#5eead4");notify("STYLE: "+sk.name,"#5eead4");saveGame();return;
  }
  if(itemOwned(it)){shopNotice(itemName(it)+" already installed","#facc15");return;}
  if(itemMaxed(it)){shopNotice(itemName(it)+" is fully upgraded","#facc15");return;}
  if(it.vehicle){
    var vid=it.vehicle,v=VEHICLES[vid];
    if(!ownedVehicles[vid]){
      if(credits<cost){shopNotice("Need "+(cost-credits)+" more credits to buy "+v.name,"#ff7675");return;}
      credits-=cost;ownedVehicles[vid]=true;vehicleRanks[vid]=1;currentVehicle=vid;P.hp=effectiveMaxHp();
      shopNotice(v.name+" purchased and deployed","#facc15");notify("NEW CHASSIS: "+v.name,"#facc15");saveGame();return;
    }
    if(currentVehicle!==vid){currentVehicle=vid;P.hp=effectiveMaxHp();shopNotice(v.name+" deployed","#cbd5e1");notify("CHASSIS: "+v.name,"#cbd5e1");saveGame();return;}
    if(credits<cost){shopNotice("Need "+(cost-credits)+" more credits to rank up "+v.name,"#ff7675");return;}
    credits-=cost;vehicleRanks[vid]++;
    P.hp=effectiveMaxHp();shopNotice(v.name+" ranked to "+vehicleRank(vid),"#facc15");notify(v.name+" RANK "+vehicleRank(vid),"#facc15");saveGame();return;
  }
  if(it.weapon){
    var id=it.weapon,w=WEAPONS[id];
    if(!ownedWeapons[id]){
      if(credits<cost){shopNotice("Need "+(cost-credits)+" more credits to unlock "+w.name,"#ff7675");return;}
      credits-=cost;ownedWeapons[id]=true;weaponLevels[id]=1;P.weapon=id;
      shopNotice(w.name+" unlocked and equipped","#facc15");notify("UNLOCKED: "+w.name,"#facc15");saveGame();return;
    }
    if(P.weapon!==id){P.weapon=id;shopNotice(w.name+" equipped","#5eead4");notify("WEAPON: "+w.name,"#5eead4");saveGame();return;}
    if(weaponLevel(id)>=(w.maxLv||5)){shopNotice(w.name+" is fully upgraded","#facc15");return;}
    if(credits<cost){shopNotice("Need "+(cost-credits)+" more credits to upgrade "+w.name,"#ff7675");return;}
    credits-=cost;weaponLevels[id]++;
    shopNotice(w.name+" upgraded to Lv."+weaponLevel(id),"#facc15");notify(w.name+" LV."+weaponLevel(id),"#facc15");saveGame();return;
  }
  if(credits<cost){shopNotice("Need "+(cost-credits)+" more credits for "+it.name,"#ff7675");return;}
  credits-=cost;
  var msg=it.apply();
  if(it.maxLv)upgradeLevels[it.id]=Math.min(it.maxLv,upgradeLevel(it.id)+1);
  shopNotice(msg,"#facc15");notify(msg,"#facc15");saveGame();
}

// ====== AUTO-AIM (limited range!) ======
function findTarget(){
  var best=null,bestD=Infinity;
  for(var i=0;i<enemies.length;i++){var d=dist(P,enemies[i]);
    // Only target enemies within bullet range (on screen, not too far)
    if(d<400&&d<bestD){bestD=d;best=enemies[i];}}
  return best;}
function findNearestEnemy(from,maxD){
  var best=null,bestD=maxD||Infinity;
  for(var i=0;i<enemies.length;i++){var d=dist(from,enemies[i]);if(d<bestD){bestD=d;best=enemies[i];}}
  return best;}

// ====== FIRE ======
function fire(){
  if(P.fireCD>0)return;
  var w=WEAPONS[P.weapon],wl=weaponLevel(P.weapon),power=weaponPower(P.weapon);
  P.fireCD=Math.max(2,Math.round(w.rate*(10/P.fireRate)/(1+wl*0.04)));
  cam.shake=Math.max(cam.shake,1.5);
  var shots=w.count+(P.weapon==="shotgun"&&wl>=4?1:0);
  for(var i=0;i<shots;i++){
    var spread=rand(-1,1)*w.spread;
    var angle=P.angle+spread;
    var bx=P.x+Math.cos(P.angle)*24,by=P.y+Math.sin(P.angle)*24;
    bullets.push({x:bx,y:by,vx:Math.cos(angle)*w.speed,vy:Math.sin(angle)*w.speed,
      dmg:effectiveDmg()*w.dmg*power,life:P.bulletRange*w.range*(1+wl*0.035),color:w.color,explosive:w.explosive||false,lvl:wl});}
  if(gt%3===0)sfx("fire");
  burst(P.x+Math.cos(P.angle)*26,P.y+Math.sin(P.angle)*26,2,"#fff",2.5,4);}

function fireMissile(){
  if(effectiveMissileCap()<=0){notify("MISSILE POD LOCKED","#ff7675");return false;}
  if(P.missileCD>0){notify("MISSILE RELOADING","#ff7675");return false;}
  if(P.missiles<=0){notify("NO MISSILES LEFT","#ff7675");return false;}
  var target=findTarget(),angle=target?Math.atan2(target.y-P.y,target.x-P.x):P.angle;
  var speed=8.4+(P.missilePower||1)*0.45;
  P.missiles--;P.missileCD=Math.max(32,96-(P.missilePower||1)*7);
  runStats.missilesFired++;
  sfx("missile");
  missiles.push({x:P.x+Math.cos(angle)*40,y:P.y+Math.sin(angle)*40,
    vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed,angle:angle,life:105,ml:105,
    dmg:140+effectiveDmg()*3+(P.missilePower||1)*52,radius:96+(P.missilePower||1)*14,color:"#fb923c"});
  cam.shake=Math.max(cam.shake,5);burst(P.x+Math.cos(angle)*36,P.y+Math.sin(angle)*36,8,"#fbbf24",4,14);
  notify("MISSILE OUT","#fb923c");saveGame();return true;
}

function detonateMissile(idx){
  var m=missiles[idx];if(!m)return;

  cam.shake=Math.max(cam.shake,11);flash=Math.max(flash,3);
  for(var i=enemies.length-1;i>=0;i--){var e=enemies[i],d=dist(m,e);
    if(d<m.radius){var dmg=m.dmg*(1-d/m.radius*0.55);e.hp-=dmg;e.hitF=12;
      floatT(e.x,e.y-e.size,Math.round(dmg).toString(),"#fff7ad",true);
      burst(e.x,e.y,8,"#fb923c",4.8,16);
      if(e.hp<=0){killSource="missile";killEnemy(i);killSource="";}}}

}

// ====== UPDATE ======
function update(){
  if(state!==S.PLAY)return;
  gt++;
	  if(comboT>0)comboT--;else combo=0;
	  if(noticeMsg.time>0)noticeMsg.time--;
	  if(saveNote>0)saveNote--;
	  if(bossIntroT>0){bossIntroT--;if(bossIntroT%52===0)sfx("line");}
	  if(edgeWarnT>0)edgeWarnT--;
	  if(keys.KeyN){audioOn=!audioOn;if(audioOn){initAudio();sfx("upgrade");}notify(audioOn?"AUDIO ON":"AUDIO OFF","#cbd5e1");keys.KeyN=false;}
	  if(keys.KeyI){inventoryOpen=!inventoryOpen;sfx("inventory");notify(inventoryOpen?"TACTICAL KIT: 1 DEMO / 2 MISSILE":"TACTICAL KIT CLOSED","#cbd5e1");keys.KeyI=false;}
	  if(keys.Digit1||keys.Numpad1){selectSpecial("demo");keys.Digit1=false;keys.Numpad1=false;}
	  if(keys.Digit2||keys.Numpad2){selectSpecial("missile");keys.Digit2=false;keys.Numpad2=false;}

  // Movement
  var mx=0,my=0;
  if(keys.KeyW||keys.ArrowUp)my=-1;if(keys.KeyS||keys.ArrowDown)my=1;
  if(keys.KeyA||keys.ArrowLeft)mx=-1;if(keys.KeyD||keys.ArrowRight)mx=1;
  if(touchCtl.target){updateTouchDriveVector();mx+=touchCtl.mx;my+=touchCtl.my;}
  var ml=Math.sqrt(mx*mx+my*my);if(ml>1){mx/=ml;my/=ml;}
	  var nextX=P.x+mx*effectiveSpeed(),nextY=P.y+my*effectiveSpeed();
	  if(nextX>enemyLineX()&&mx>0.05&&edgeWarnT<=0){edgeWarnT=70;sfx("line");notify("ENEMY LINE - HOLD THIS SIDE","#ff7675");}
	  P.x=nextX;P.y=nextY;
	  P.y=Math.max(25,Math.min(H-25,P.y));P.x=Math.max(25,Math.min(enemyLineX(),P.x));
  if((Math.abs(mx)+Math.abs(my)>0.08)&&gt%3===0){
    particles.push({x:P.x-Math.cos(P.angle)*32+rand(-8,8),y:P.y-Math.sin(P.angle)*24+rand(-16,16),vx:rand(-0.45,0.25),vy:rand(-0.35,0.35),life:38,ml:38,color:"rgba(101,91,70,0.42)",size:rand(8,18)});}
  if(gt%10===0){
    particles.push({x:P.x-Math.cos(P.angle)*34,y:P.y-18,vx:-0.25+rand(-0.3,0.2),vy:-0.55+rand(-0.2,0.1),life:60,ml:60,color:"rgba(50,54,55,0.42)",size:rand(7,15)});}

  // Spawn enemies over time (not all at once)
  if(enemiesSpawned<enemiesThisLevel){
    spawnTimer++;
    if(spawnTimer>45){spawnTimer=0;enemiesSpawned++;
      var r=Math.random();
      if(r<0.35)spawnEnemy("grunt");else if(r<0.55)spawnEnemy("fast");
      else if(r<0.75)spawnEnemy("tank");else spawnEnemy("sniper");}}
	  // Boss enters only after the regular wave is completely cleared.
	  if(!bossSpawned&&enemiesSpawned>=enemiesThisLevel&&levelKills>=enemiesThisLevel&&enemies.length===0){spawnBoss();}

  // Auto-aim
  var target=findTarget();
  if(target){P.angle=Math.atan2(target.y-P.y,target.x-P.x);fire();}
  if(P.fireCD>0)P.fireCD--;
  if(P.missileCD>0)P.missileCD--;
  if(P.invT>0)P.invT--;
	  if(keys.KeyQ||keys.KeyB){selectSpecial("demo");useBomb();keys.KeyQ=false;keys.KeyB=false;}
	  if(keys.Space){useActiveSpecial();keys.Space=false;}
	  if(keys.KeyM){if(effectiveMissileCap()>0)selectSpecial("missile");fireMissile();keys.KeyM=false;}
  if(base.hitF>0)base.hitF--;
  if((village.turret||0)>0&&enemies.length&&gt%villageTurretRate()===0){
    var bt=findNearestEnemy(base,900);
    if(bt){var ba=Math.atan2(bt.y-base.y,bt.x-base.x);
      baseBullets.push({x:base.x+42,y:base.y-26,vx:Math.cos(ba)*11,vy:Math.sin(ba)*11,life:70,dmg:villageTurretDamage(),color:"#d1d5db"});
      burst(base.x+38,base.y-24,3,"#d1d5db",2,8);}}

  // Guided missiles
  for(var i=missiles.length-1;i>=0;i--){
    var m=missiles[i],mt=findNearestEnemy(m,360);
    if(mt){var ta=Math.atan2(mt.y-m.y,mt.x-m.x),sp=Math.sqrt(m.vx*m.vx+m.vy*m.vy);
      m.vx=m.vx*0.91+Math.cos(ta)*sp*0.09;m.vy=m.vy*0.91+Math.sin(ta)*sp*0.09;m.angle=Math.atan2(m.vy,m.vx);}
    m.x+=m.vx;m.y+=m.vy;m.life--;
    if(gt%2===0)particles.push({x:m.x-Math.cos(m.angle)*18,y:m.y-Math.sin(m.angle)*18,
      vx:-Math.cos(m.angle)*0.9+rand(-0.4,0.4),vy:-Math.sin(m.angle)*0.9+rand(-0.4,0.4),
      life:32,ml:32,color:"rgba(95,96,88,0.62)",size:rand(5,12)});
    var hit=false;
    for(var mj=enemies.length-1;mj>=0;mj--){if(dist(m,enemies[mj])<enemies[mj].size+10){detonateMissile(i);hit=true;break;}}
    if(hit)continue;
    if(m.life<=0||m.x>W+80||m.x<-80||m.y<-80||m.y>H+80)detonateMissile(i);
  }

  // Launched demolition charges
  for(var i=charges.length-1;i>=0;i--){
    var ch=charges[i],ct=ch.target&&enemies.indexOf(ch.target)>=0?ch.target:findNearestEnemy(ch,300);
    if(ct){var ca=Math.atan2(ct.y-ch.y,ct.x-ch.x),cs=Math.sqrt(ch.vx*ch.vx+ch.vy*ch.vy);
      ch.vx=ch.vx*0.95+Math.cos(ca)*cs*0.05;ch.vy=ch.vy*0.95+Math.sin(ca)*cs*0.05;ch.angle=Math.atan2(ch.vy,ch.vx);}
    ch.x+=ch.vx;ch.y+=ch.vy;ch.life--;
    if(gt%2===0)particles.push({x:ch.x-Math.cos(ch.angle)*12,y:ch.y-Math.sin(ch.angle)*12,
      vx:-Math.cos(ch.angle)*0.45+rand(-0.25,0.25),vy:-Math.sin(ch.angle)*0.45+rand(-0.25,0.25),
      life:28,ml:28,color:"rgba(58,54,43,0.68)",size:rand(4,10)});
    var detonated=false;
    for(var ci=enemies.length-1;ci>=0;ci--){if(dist(ch,enemies[ci])<enemies[ci].size+18){detonateCharge(i);detonated=true;break;}}
    if(detonated)continue;
    if(ch.life<=0||ch.x>W+80||ch.x<-80||ch.y<-80||ch.y>H+80)detonateCharge(i);
  }

  // Village turret rounds
  for(var i=baseBullets.length-1;i>=0;i--){
    var tb=baseBullets[i];tb.x+=tb.vx;tb.y+=tb.vy;tb.life--;
    if(tb.life<=0||tb.x>W+20||tb.y<-20||tb.y>H+20){baseBullets.splice(i,1);continue;}
    for(var bj=enemies.length-1;bj>=0;bj--){var be=enemies[bj];
